app-id: com.github.petebuffon.yafc
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: YAFC
finish-args:
  - --device=dri
  - --socket=x11
  - --share=ipc
  - --filesystem=~/.factorio/mods:ro
  - --filesystem=~/.steam/steam/steamapps/common/Factorio/data:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam:ro
  - --persist=.yafc
modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_ttf.json
  - name: yafc
    buildsystem: simple
    build-commands:
      - mkdir .yafc
      - mkdir /app/bin
      - tar xfvz yafc.tar.gz -C /app/bin
      - install -Dp -m 644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dp -m 644 ${FLATPAK_ID}.appdata.xml -t /app/share/metainfo/
      - install -Dp -m 644 ${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: file
        url: https://github.com/petebuffon/yafc/releases/download/v0.6.0/yafc.tar.gz
        sha256: 0eb5edc0b6871922059815ae4fb52bf508ea3b443519996823ca62b19865af6d
      - type: file
        path: com.github.petebuffon.yafc.desktop
      - type: file
        path: com.github.petebuffon.yafc.appdata.xml
      - type: file
        path: com.github.petebuffon.yafc.svg
